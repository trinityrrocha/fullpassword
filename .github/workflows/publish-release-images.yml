name: Publish audited release images

on:
  push:
    branches:
      - release/builder-67c236e0

permissions:
  contents: read
  packages: write

concurrency:
  group: release-builder-67c236e0
  cancel-in-progress: false

env:
  SOURCE_SHA: 67c236e02d9dd938386d5295b5f0676b1ae562ba
  SOURCE_REPOSITORY: https://github.com/trinityrrocha/fullpassword
  BACKEND_REPOSITORY: ghcr.io/trinityrrocha/fullpassword-backend
  FRONTEND_REPOSITORY: ghcr.io/trinityrrocha/fullpassword-frontend

jobs:
  publish:
    if: github.repository == 'trinityrrocha/fullpassword' && github.ref == 'refs/heads/release/builder-67c236e0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact application source, not builder commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 67c236e02d9dd938386d5295b5f0676b1ae562ba
          persist-credentials: false
          fetch-depth: 0

      - name: Assert source and prepare public evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git diff --check
          docker buildx version
          mkdir -p "$RUNNER_TEMP/release-evidence"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/release-evidence/application-source.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-evidence/builder-commit.txt"
          cat > "$RUNNER_TEMP/verify-images.py" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          backend, frontend, phase = sys.argv[1:]
          source = os.environ['SOURCE_SHA']
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          def inspect(image):
              labels = json.loads(run('docker', 'image', 'inspect', '--format', '{{json .Config.Labels}}', image))
              assert labels['org.opencontainers.image.source'] == os.environ['SOURCE_REPOSITORY']
              assert labels['org.opencontainers.image.revision'] == source
              return {'imageId': run('docker', 'image', 'inspect', '--format', '{{.Id}}', image),
                      'user': run('docker', 'image', 'inspect', '--format', '{{.Config.User}}', image),
                      'labels': labels}
          b, f = inspect(backend), inspect(frontend)
          assert b['user'] == 'node'
          run('docker', 'run', '--rm', '--entrypoint', 'node', backend, '-e',
              "(async()=>{const a=require('argon2');const assert=require('node:assert/strict');"
              "assert.equal(process.getuid(),1000);assert.equal(process.env.BACKEND_APP_COMMIT,'" + source + "');"
              "const h=await a.hash('SYNTHETIC_RELEASE_RUNTIME_TEST');assert(await a.verify(h,'SYNTHETIC_RELEASE_RUNTIME_TEST'));"
              "assert(!require('node:fs').existsSync('/usr/src/app/.git'));console.log('Backend runtime PASS')})()"
              ".catch(()=>{console.error('Backend runtime verification failed');process.exit(1)})")
          version = json.loads(run('docker', 'run', '--rm', '--entrypoint', 'cat', frontend,
                                   '/usr/share/nginx/html/version.json'))
          assert version['revision'] == source
          run('docker', 'run', '--rm', '--entrypoint', 'sh', frontend, '-c',
              'test ! -e /usr/share/nginx/html/.git')
          evidence = {'source': source, 'phase': phase, 'backend': b, 'frontend': f,
                      'backendNativeArgon2': 'PASS', 'backendCommit': source,
                      'frontendVersion': version, 'gitAbsentFromApplicationPaths': 'PASS'}
          path = Path(os.environ['RUNNER_TEMP']) / 'release-evidence' / (phase + '.json')
          path.write_text(json.dumps(evidence, indent=2) + '\n')
          if phase == 'post-publication':
              previous = json.loads((path.parent / 'pre-publication.json').read_text())
              assert previous['backend']['imageId'] == b['imageId']
              assert previous['frontend']['imageId'] == f['imageId']
          print(phase + ': user, Argon2, exact revision, OCI labels and image identity PASS')
          PY

      - name: Build both images locally on the runner
        run: |
          set -euo pipefail
          docker buildx build --load --provenance=false \
            --build-arg BACKEND_APP_COMMIT="$SOURCE_SHA" \
            --label org.opencontainers.image.source="$SOURCE_REPOSITORY" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --tag "$BACKEND_REPOSITORY:$SOURCE_SHA" ./backend
          docker buildx build --load --provenance=false \
            --build-arg VITE_APP_COMMIT="$SOURCE_SHA" --build-arg VITE_API_URL=/api \
            --label org.opencontainers.image.source="$SOURCE_REPOSITORY" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --tag "$FRONTEND_REPOSITORY:$SOURCE_SHA" ./frontend
          python3 "$RUNNER_TEMP/verify-images.py" "$BACKEND_REPOSITORY:$SOURCE_SHA" "$FRONTEND_REPOSITORY:$SOURCE_SHA" pre-publication

      - name: Check existing package association without modifying visibility
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          results = []
          for name in ['fullpassword-backend', 'fullpassword-frontend']:
              req = urllib.request.Request('https://api.github.com/users/trinityrrocha/packages/container/' + name,
                  headers={'Authorization': 'Bearer ' + os.environ['GHCR_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      package = json.load(response)
                  repository = (package.get('repository') or {}).get('full_name')
                  results.append({'name': name, 'status': 'existing', 'repository': repository,
                                  'visibility': package.get('visibility')})
                  assert repository == 'trinityrrocha/fullpassword', 'EXISTING_PACKAGE_ASSOCIATION_MISMATCH'
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise SystemExit('GHCR_PACKAGE_ACCESS_CHECK_FAILED: HTTP ' + str(error.code))
                  results.append({'name': name, 'status': 'absent-or-inaccessible', 'httpStatus': 404})
          Path(os.environ['RUNNER_TEMP'], 'release-evidence', 'package-baseline.json').write_text(json.dumps(results, indent=2) + '\n')
          print('Existing package association check complete; no visibility changes')
          PY

      - name: Authenticate with automatic GITHUB_TOKEN only
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Docker's ephemeral runner credential store is never uploaded and is removed below.
          mkdir -m 700 "$RUNNER_TEMP/ghcr-auth"
          printf '%s' "$GHCR_TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth" docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      - name: Refuse to overwrite an existing source tag
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          for repository in "$BACKEND_REPOSITORY" "$FRONTEND_REPOSITORY"; do
            if docker buildx imagetools inspect "$repository:$SOURCE_SHA" >/dev/null 2>"$RUNNER_TEMP/tag-check.err"; then
              echo 'SOURCE_TAG_ALREADY_EXISTS: stop without overwriting an existing release'
              exit 1
            fi
            if ! grep -Eqi 'not found|manifest unknown|404' "$RUNNER_TEMP/tag-check.err"; then
              cat "$RUNNER_TEMP/tag-check.err"
              exit 1
            fi
          done

      - name: Publish tested inputs and capture registry manifest digests
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          docker buildx build --push --provenance=false \
            --build-arg BACKEND_APP_COMMIT="$SOURCE_SHA" \
            --label org.opencontainers.image.source="$SOURCE_REPOSITORY" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --tag "$BACKEND_REPOSITORY:$SOURCE_SHA" \
            --metadata-file "$RUNNER_TEMP/release-evidence/backend-build-metadata.json" ./backend
          docker buildx build --push --provenance=false \
            --build-arg VITE_APP_COMMIT="$SOURCE_SHA" --build-arg VITE_API_URL=/api \
            --label org.opencontainers.image.source="$SOURCE_REPOSITORY" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --tag "$FRONTEND_REPOSITORY:$SOURCE_SHA" \
            --metadata-file "$RUNNER_TEMP/release-evidence/frontend-build-metadata.json" ./frontend

      - name: Re-query registry and verify pulled immutable images
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP'], 'release-evidence')
          images = {}
          for service in ['backend', 'frontend']:
              metadata = json.loads((evidence / (service + '-build-metadata.json')).read_text())
              digest = metadata['containerimage.digest']
              assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
              repository = os.environ[service.upper() + '_REPOSITORY']
              reference = repository + '@' + digest
              registry = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', reference], text=True)
              (evidence / (service + '-registry-inspect.txt')).write_text(registry)
              assert re.search(r'^Digest:\s+' + re.escape(digest) + r'\s*$', registry, re.MULTILINE)
              subprocess.run(['docker', 'pull', reference], check=True)
              repo_digests = json.loads(subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{json .RepoDigests}}', reference], text=True))
              assert reference in repo_digests
              images[service] = {'repository': repository, 'tag': os.environ['SOURCE_SHA'],
                                 'digest': digest, 'reference': reference, 'repoDigests': repo_digests}
          (evidence / 'published-images.json').write_text(json.dumps(images, indent=2) + '\n')
          subprocess.run(['python3', os.environ['RUNNER_TEMP'] + '/verify-images.py',
                          images['backend']['reference'], images['frontend']['reference'], 'post-publication'], check=True)
          PY

      - name: Independent anonymous pull using empty Docker credential store
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ghcr-anonymous"
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-anonymous"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP'], 'release-evidence')
          images = json.loads((evidence / 'published-images.json').read_text())
          results, failed = {}, False
          for service, image in images.items():
              result = subprocess.run(['docker', 'pull', image['reference']], text=True, capture_output=True)
              output = result.stdout + result.stderr
              (evidence / (service + '-anonymous-pull.txt')).write_text(output)
              requires_auth = result.returncode != 0 and any(word in output.lower() for word in ['unauthorized', 'denied', 'forbidden', 'authentication'])
              results[service] = {'reference': image['reference'], 'result': 'PASS' if result.returncode == 0 else 'FAIL',
                                  'requiresAuth': requires_auth, 'exitCode': result.returncode}
              failed |= result.returncode != 0
              print(service + ' anonymous pull: ' + results[service]['result'])
              if requires_auth:
                  print('GHCR_PACKAGE_REQUIRES_AUTH: YES')
          (evidence / 'anonymous-pull.json').write_text(json.dumps(results, indent=2) + '\n')
          if failed:
              raise SystemExit('Operational pull blocked; no package visibility changes or VM credentials are authorized')
          PY

      - name: Remove ephemeral registry credentials
        if: always()
        run: |
          set -euo pipefail
          if test -d "$RUNNER_TEMP/ghcr-auth"; then
            DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth" docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$RUNNER_TEMP/ghcr-auth"
          fi
          rm -rf -- "$RUNNER_TEMP/ghcr-anonymous"

      - name: Upload only public release evidence (never Docker credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-67c236e0
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 30
